schema_version: "1.0"

severity_values:
  P0: "Blocks architecture finalization."
  P1: "Important before customer or technical review."
  P2: "Track but can defer."
  P3: "Nice-to-have or style."
  wont_fix: "Accepted risk or intentionally out of scope."

status_values:
  - proposed
  - accepted
  - rejected
  - deferred
  - fixed
  - verified

issue_template:
  id: "ARCH-P0-000"
  title: ""
  severity: "P0"
  yc_blocker: false
  architecture_blocker: true
  status: "proposed"
  github_issue: null
  source_files: []
  checklist_categories: []
  problem: ""
  required_fix: ""
  acceptance_criteria: []
  suggested_openspec_change: ""
  notes: ""

issues:

  - id: "ARCH-P0-001"
    title: "Product wedge framing in architecture content does not match governance framing"
    bucket: "A"
    severity: "P0"
    status: "proposed"
    files:
      - "architecture/source-of-truth.md"
      - "architecture/review/finalization-checklist.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/mvp-scope.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/ZOVARK-v3.2.4.6-FINAL.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/ENGINEERING-READY-HANDOFF.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/OWNERS.yaml"
    evidence:
      - "Governance: 'Zovark is consistently described as the tape recorder for cybersecurity investigations.' (architecture/review/finalization-checklist.md)"
      - "Governance core flow: 'EDR alerts → investigation tape → replayable evidence → verdict → EDR handoff.' (architecture/review/finalization-checklist.md)"
      - "mvp-scope.md product wedge instead reads: 'Zovark records tenant-scoped security investigations, preserves evidence, reconstructs timelines, produces evidence-backed findings, derives deterministic verdicts when the verdict subsystem exists, and supports policy-gated external-action handoff.' — no mention of tape, EDR-driven flow, or replayable evidence terminology."
      - "Repo-wide grep: 'tape recorder' appears only as a component name in OWNERS.yaml line 45 ('Replay engine and tape recorder; F-002') and in ADR-0043 line 59 ('Tape recorder implementation'); 'investigation tape' / 'replayable evidence' do not appear anywhere."
      - "EDR is treated as one adapter among many (OWNERS.yaml line 51 'EDR adapter and response governance; F-004'), not as the canonical entry/exit of the wedge."
    notes: |
      Finalization checklist criterion #1 is product-wedge clarity. The architecture content
      uses different vocabulary from the governance framing and does not describe an
      EDR-bookended flow. Either update governance to match the architecture's actual
      wedge, or update architecture content (mvp-scope, FINAL, HANDOFF) to express the
      "tape recorder / EDR-bookended investigation tape" framing consistently. Until
      reconciled, the wedge is incoherent across the source-of-truth hierarchy.

  - id: "ARCH-P1-001"
    title: "Claim-provenance enforcement missing from M0 deliverables"
    bucket: "C"
    severity: "P1"
    status: "proposed"
    files:
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/claims/claim-provenance.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/invariants.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/ENGINEERING-READY-HANDOFF.md"
    evidence:
      - "claim-provenance.md: 'No claim-provenance checker exists in this patch tree. scripts/check_claim_provenance.py is an M0 deliverable before customer-facing architecture review.'"
      - "invariants.md INV-022: 'Enforcement by scripts/check_claim_provenance.py is an M0 deliverable and is not present in this patch tree.'"
      - "ENGINEERING-READY-HANDOFF.md: '2. Implement scripts/check_claim_provenance.py.'"
    notes: |
      M0 is described as bootstrap (before engineering work starts), but claim-provenance
      enforcement is missing, leaving no mechanism to validate that customer-facing
      claims meet provenance rules. Promote to P0 if customer-facing review is imminent.

  - id: "ARCH-P1-002"
    title: "ADR-0043 strategic-pivot decision (open-source) blocks bootstrap baseline tag"
    bucket: "D"
    severity: "P1"
    status: "proposed"
    files:
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/adr/0043-open-source-release-strategy.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/DD_BLOCKERS-v3.2.4.5-additions.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/PATCH-README.md"
    evidence:
      - "ADR-0043: 'Status: PROPOSED — STRATEGIC PIVOT pending founder sign-off.'"
      - "DD_BLOCKERS: 'M1-DECISION-001: accept, amend, or reject ADR-0043 source model. ... Deadline: before tag v3.2.4.5-bootstrap-baseline.'"
      - "PATCH-README.md Step 9: 'Before tagging v3.2.4.5-bootstrap-baseline: ... M1-DECISION-001 (founder sign-off on ADR-0043) is resolved.'"
    notes: |
      Founder sign-off is explicitly a blocking decision before tagging/finalizing the
      bootstrap baseline. Architecture review can proceed in parallel, but the baseline
      tag (and therefore engineering kickoff for several M1 streams) is blocked until
      this decision is made.

  - id: "ARCH-P2-001"
    title: "ADR-0042 key compromise drill — schedule vs. contingency ambiguity"
    bucket: "C"
    severity: "P2"
    status: "proposed"
    files:
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/adr/0042-cryptographic-key-management.md"
    evidence:
      - "ADR-0042 line 66: 'This is the worst-case event and has no automated path; it is an operational drill rehearsed twice per year [policy-commitment:security-officer,semiannual-review].'"
      - "ADR-0042 line 85: 'Operational overhead: HSM procurement, ceremony procedures, rotation calendar, compromise drill twice a year.'"
    notes: |
      'Twice per year' is mentioned, but whether this is a contingency-only response
      (run on-demand if compromise happens) versus a scheduled calendar drill is
      ambiguous; future audit and ops teams may interpret differently.

  - id: "ARCH-P2-002"
    title: "ADR-0038 control-plane DR plan deferred without design sketch"
    bucket: "B"
    severity: "P2"
    status: "proposed"
    files:
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/adr/0038-control-plane-and-customer-instance-authority-boundary.md"
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/adr-index.md"
    evidence:
      - "ADR-0038: 'Loss of the Control Plane DB must not affect customer instance data authority.'"
      - "Patch adr-index.md note under ADR-0038: 'Does not implement runtime data-classification enforcement or DR drills.'"
      - "Patch adr-index.md Human Decisions: 'ADR-0038 DR plan details: RPO/RTO, same-region HA vs cross-region DR, restore-drill cadence.'"
    notes: |
      Data-authority isolation is core to the trust model (INV-029), but the control
      plane's own resilience strategy is completely deferred with no design sketch,
      creating risk for M2+ implementation decisions.

  - id: "ARCH-P3-001"
    title: "ADR-0040 Research Pipeline corpora composition under-specified"
    bucket: "C"
    severity: "P3"
    status: "proposed"
    files:
      - "zovark-v3.2.4.6-engineering-ready/zovark-v3.2.4.6-patch/architecture/adr/0040-research-pipeline-and-gated-candidate-promotion.md"
    evidence:
      - "ADR-0040 line 25: 'Runs nightly against fixed corpora (replay fixtures, dead-code corpora, security-test corpora, benchmark corpora). Corpora land at M5; Research Pipeline runs first at M6.'"
    notes: |
      Corpus composition (count, diversity, sources) is not sketched; the M5 team will
      inherit ambiguity about what 'fixed corpora' means operationally.
